<p>Paraguas se mudó a<br><a href="https://paraguas.solitary-block-6684.workers.dev/">paraguas.solitary-block-6684.workers.dev</a></p>
<script>
  // Suelta el service worker viejo de /clima/ antes de irse, para que no quede pegado.
  var NUEVA = "https://paraguas.solitary-block-6684.workers.dev/";
  function ir() { location.replace(NUEVA); }
  try {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }).then(function () {
        return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null;
      }).then(ir, ir);
    } else { ir(); }
  } catch (e) { ir(); }
</script>
